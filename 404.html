<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — AkiraVD</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* Inlined so this page renders at any depth, on any host, with no path to get wrong. */
  :root {
    --page:#07090a; --window:#0b0f0e; --chrome:#101614; --rule:#1b2420; --dot:#2a3531;
    --text:#b9c4bd; --bright:#e4ece6; --muted:#8a968f; --faint:#4e5b56; --accent:#6ab98a;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; background:var(--page); color:var(--text);
         font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:14px; line-height:1.75; padding:clamp(16px,3vw,40px); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { color:#96d6b0; text-decoration:underline; }
  .win { max-width:1180px; margin:0 auto; border:1px solid var(--rule); border-radius:8px;
         background:var(--window); overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.6); }
  .win-bar { display:flex; align-items:center; gap:10px; padding:12px 16px;
             background:var(--chrome); border-bottom:1px solid var(--rule); }
  .dots { display:flex; gap:7px; }
  .dots span { width:10px; height:10px; border-radius:50%; background:var(--dot); }
  .win-title { font-size:12px; color:var(--faint); margin-left:8px; }
  .win-body { padding:clamp(28px,4vw,44px) clamp(20px,4vw,48px) clamp(36px,5vw,52px); }
  .cmd { display:flex; gap:10px; color:var(--bright); margin:0; }
  .cmd::before { content:"$"; color:var(--accent); font-weight:700; }
  .out { padding-left:22px; }
  h1 { font-weight:500; margin:0; font-size:clamp(22px,3.2vw,32px); color:var(--bright);
       letter-spacing:-0.015em; line-height:1.2; }
  .err { color:var(--muted); max-width:60ch; margin:16px 0 0; text-wrap:pretty; }
  .cursor { display:inline-block; width:9px; height:1.05em; background:var(--accent);
            vertical-align:-0.18em; margin-left:4px; animation:blink 1.05s step-end infinite; }
  @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .cursor { animation:none; } }
</style>
</head>
<body>

<div class="win">
  <header class="win-bar">
    <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
    <span class="win-title">akiravd@hcm &mdash; 404</span>
  </header>
  <main class="win-body" id="main">
    <p class="cmd">cat that-page</p>
    <div class="out">
      <h1>No such file or directory.</h1>
      <p class="err">The link may be out of date, or I may have moved something. The work is all still on the front page.</p>
      <p style="margin-top:22px;"><a href="/">cd ~ &rarr;</a></p>
    </div>
    <p class="cmd" style="margin-top:26px;" aria-hidden="true"><span class="cursor"></span></p>
  </main>
</div>

</body>
</html>
